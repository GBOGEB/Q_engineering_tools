name: W285 Exact Federation Function Depth Proof

on:
  pull_request:
    paths:
      - federation/w285/**
      - .github/workflows/w285-federation-depth-exact.yml
  push:
    branches: [main]
    paths:
      - federation/w285/**
      - .github/workflows/w285-federation-depth-exact.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  exact-w285-depth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federation/w285/payload
    steps:
      - name: Checkout exact consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact W285 source and validator blobs
        shell: bash
        run: |
          test "$(git hash-object upstream/QPS_ROUTING_FUNCTION_SUBSURFACE_DEPTH_v1.json)" = "a9ba70c2ed00e30e0153099062736c347c51cfa0"
          test "$(git hash-object scripts/qps_w285_validate_federation_depth.py)" = "972a8c38e0e906ba8ca5e3f5faf1449f1cd70b3d"
          test "$(git hash-object tests/test_qps_w285_federation_depth.py)" = "39f362fbc1fbba4a7791ff636fd0a7377ed031c7"
          test "$(git hash-object ../../w283r/payload/triage/w283/upstream/QPS_REPO_FUNCTION_TOPOLOGY_v1.yaml)" = "df0ee845697578cd644691b81eafb2465249d772"
          test "$(git hash-object ../../w283r/payload/triage/w283/QPS_W283_FEDERATION_SAMPLE_ROUTING_CROSSWALK_v0.1.json)" = "cb3133ec98adb2cdf096376fe5b00ccc606172d1"

      - name: Execute W285 depth validator
        run: python scripts/qps_w285_validate_federation_depth.py --out w285-depth-validation-receipt.json

      - name: Execute W285 depth tests
        run: python -m unittest tests/test_qps_w285_federation_depth.py -v

      - name: Upload W285 depth receipt
        uses: actions/upload-artifact@v4
        with:
          name: w285-depth-${{ github.event.pull_request.head.sha || github.sha }}
          path: federation/w285/payload/w285-depth-validation-receipt.json

      - name: Publish observable W285 main repeat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "W285 DEPTH MAIN REPEAT PASS ${GITHUB_RUN_ID}" \
            --body "Exact W285 function-depth proof passed on main. run_id=${GITHUB_RUN_ID}; sha=${GITHUB_SHA}; pipeline_source_pr=259; depth_blob=a9ba70c2ed00e30e0153099062736c347c51cfa0; B=4/12; D=5/16; PEN=5/48; authority_transfer=false; formal_credit_delta=0."

name: W285F Exact Federation Function Depth Proof

on:
  pull_request:
    paths:
      - federation/w285/**
      - .github/workflows/w285-federation-depth-exact.yml
  push:
    branches: [main]
    paths:
      - federation/w285/**
      - .github/workflows/w285-federation-depth-exact.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  exact-w285:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federation/w285/payload
    steps:
      - name: Checkout exact consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify five exact QPS source blobs
        shell: bash
        run: |
          test "$(git hash-object triage/w285/QPS_W285_FEDERATION_FUNCTION_DEPTH_v0.1.json)" = "691680cdf11289142b402a0ae02c95d46a246473"
          test "$(git hash-object scripts/qps_w285_validate_federation_depth.py)" = "1ae329f7485cd8bc32dd4253dc2c8bc147410d7b"
          test "$(git hash-object tests/test_qps_w285_federation_depth.py)" = "19ffae87a17198a2a3725be8035db0ccde9e8433"
          test "$(git hash-object triage/w285/QPS_W285_3PSTAR_MIP_CONTROL_v0.1.json)" = "868861de8da3221a2a9bd934ac960e7798340110"
          test "$(git hash-object triage/w283/upstream/QPS_REPO_FUNCTION_TOPOLOGY_v1.yaml)" = "df0ee845697578cd644691b81eafb2465249d772"

      - name: Execute W285 function depth validator
        shell: bash
        run: python scripts/qps_w285_validate_federation_depth.py | tee w285f-validation-receipt.json

      - name: Execute W285 tests
        shell: bash
        run: python -m pytest -q tests/test_qps_w285_federation_depth.py

      - name: Upload W285F receipt
        uses: actions/upload-artifact@v4
        with:
          name: w285f-${{ github.event.pull_request.head.sha || github.sha }}
          path: federation/w285/payload/w285f-validation-receipt.json

      - name: Publish observable W285F main repeat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create             --repo "${GITHUB_REPOSITORY}"             --title "W285F MAIN REPEAT PASS ${GITHUB_RUN_ID}"             --body "Exact W285 5/5 source blobs, topology current_use denominator, validator, tests and artifact upload passed on main. run_id=${GITHUB_RUN_ID}; sha=${GITHUB_SHA}; source_qps_pr=1490; source_qps_head=f732bac39d9a92ab296982f08ca17185ec51812f; B=4/12; D=0.6; PEN=0.2; authority_transfer=false; formal_credit_delta=0."

name: QPS Reliability G5 Federated Exact

on:
  pull_request:
    paths:
      - 'ocd-adr/40_implementation/QPS_RELIABILITY_SHARED_STATE_LEDGER_G2_v0.1.json'
      - 'ocd-adr/40_implementation/QPS_COST_RELIABILITY_BRIDGE_v0.2.yaml'
      - 'scripts/qps_reliability_g5_cost_rcm_spares.py'
      - '.github/workflows/qps-reliability-g5-federated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g5-exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove exact child payload blobs
        run: |
          test "$(git hash-object ocd-adr/40_implementation/QPS_RELIABILITY_SHARED_STATE_LEDGER_G2_v0.1.json)" = "525b34004838e9131f26d4d6068390274df0063c"
          test "$(git hash-object ocd-adr/40_implementation/QPS_COST_RELIABILITY_BRIDGE_v0.2.yaml)" = "7b9a0f3b72eefbeaafd1dba05a20e4cfe4cf2a95"
          test "$(git hash-object scripts/qps_reliability_g5_cost_rcm_spares.py)" = "2574354f7883a6b92a4241a060bf846c3b9c5174"
      - name: Execute exact G5 COST RCM spares hook generator
        run: python3 scripts/qps_reliability_g5_cost_rcm_spares.py
      - name: Bind federated execution provenance
        env:
          EXECUTOR_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('artifacts/qps_reliability_g5/g5_receipt.json')
          r = json.loads(p.read_text())
          assert r['hook_fields_present_all_states'] is True
          assert r['governed_unknowns_preserved_as_null'] is True
          assert r['governed_numeric_cost_rows_ready'] == 0
          assert r['governed_numeric_cost_rows_total'] == 3
          assert r['source_gates_for_actual_spares_values'] == [974, 981]
          assert r['no_energy_to_spares_inference'] is True
          assert r['no_reliability_to_spare_cost_inference'] is True
          assert r['non_engineering_test_vectors'] == 'PASS_EXCLUDED_FROM_ENGINEERING'
          assert r['G5_candidate'] == 'PASS_EXECUTABLE_COST_RCM_SPARES_HOOK_TOPOLOGY'
          assert r['G5_actual_numeric_cost_release'] == 'WITHHELD_SOURCE_VALUES'
          fed = {
              'schema': 'qps.reliability.g5.federated_execution_receipt.v0.1',
              'source_repository': 'GBOGEB/cryoplant-project',
              'source_candidate_head': '8fe7c704620336087152a952101e12f7002d47a8',
              'source_merge_sha': '4484f934c705c051563efd3d9c0a6cef39a8d93a',
              'source_blobs': {
                  'ledger': '525b34004838e9131f26d4d6068390274df0063c',
                  'bridge': '7b9a0f3b72eefbeaafd1dba05a20e4cfe4cf2a95',
                  'generator': '2574354f7883a6b92a4241a060bf846c3b9c5174'
              },
              'executor_repository': 'GBOGEB/Q_engineering_tools',
              'executor_sha': os.environ['EXECUTOR_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'result': 'PASS_FEDERATED_EXACT_PAYLOAD',
              'G5_actual_numeric_cost_release': 'WITHHELD_SOURCE_VALUES',
              'engineering_credit_delta': 0
          }
          Path('artifacts/qps_reliability_g5/federated_execution_receipt.json').write_text(
              json.dumps(fed, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qps-reliability-g5-federated-receipt
          path: artifacts/qps_reliability_g5/
          if-no-files-found: error

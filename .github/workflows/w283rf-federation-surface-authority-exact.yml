name: W283RF Exact Federation Surface Authority Proof

on:
  pull_request:
    paths:
      - federation/w283r/**
      - .github/workflows/w283rf-federation-surface-authority-exact.yml
  push:
    branches: [main]
    paths:
      - federation/w283r/**
      - .github/workflows/w283rf-federation-surface-authority-exact.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  exact-w283r:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federation/w283r/payload
    steps:
      - name: Checkout exact consumer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify eight exact W283R source blobs
        shell: bash
        run: |
          test "$(git hash-object triage/w283/QPS_W283_FEDERATION_SAMPLE_ROUTING_CROSSWALK_v0.1.json)" = "cb3133ec98adb2cdf096376fe5b00ccc606172d1"
          test "$(git hash-object triage/w283/QPS_W283_BT_BRIDGE_ADMISSIBILITY_WATCH_v0.1.json)" = "2f9819f62e2c493e2529e5e81d9a8559017bd0fb"
          test "$(git hash-object triage/w283/QPS_W283_FEDERATION_SURFACE_3PSTAR_MIP_CONTROL_v0.1.json)" = "3c89e0a7ba7a1487f0824d3b1d7a6cbe3d5aff26"
          test "$(git hash-object triage/w283/upstream/QPS_REPO_FUNCTION_TOPOLOGY_v1.yaml)" = "df0ee845697578cd644691b81eafb2465249d772"
          test "$(git hash-object triage/w280/QPS_W280_GOVERNED_SURFACE_CENSUS_v0.2.json)" = "967205bb52ce9c7c43771b63641df6d714d7ca07"
          test "$(git hash-object scripts/qps_w283_validate_federation_surface.py)" = "7893031f45f16c454d0f96aa3ba7d214e516b8ec"
          test "$(git hash-object tests/test_qps_w283_federation_surface.py)" = "a7cba3793df26d20bdd19a220dedee3f75a23b7e"
          test "$(git hash-object .github/workflows/qps-w283-federation-surface.yml)" = "b2e08ac0168ef878c41392735867672123d59544"

      - name: Execute repaired W283R validator
        run: python scripts/qps_w283_validate_federation_surface.py --out w283rf-validation-receipt.json

      - name: Execute repaired W283R tests
        run: python -m unittest tests/test_qps_w283_federation_surface.py -v

      - name: Upload W283RF receipt
        uses: actions/upload-artifact@v4
        with:
          name: w283rf-${{ github.event.pull_request.head.sha || github.sha }}
          path: federation/w283r/payload/w283rf-validation-receipt.json

      - name: Publish observable W283RF main repeat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "W283RF MAIN REPEAT PASS ${GITHUB_RUN_ID}" \
            --body "Repaired exact W283R 8/8 source blobs, authoritative topology/census set equality, validator, tests and artifact upload passed on main. run_id=${GITHUB_RUN_ID}; sha=${GITHUB_SHA}; source_qps_pr=1483; source_qps_head=4aeeddb9cfaa9f68f8080e21273671d5ad47dcb2; function_breadth=4/12; function_depth=null; global_fleet_penetration=null; authority_transfer=false."

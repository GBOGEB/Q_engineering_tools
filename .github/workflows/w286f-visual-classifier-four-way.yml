name: W286F Visual Classifier Four Way

on:
  pull_request:
    paths:
      - '.github/workflows/w286f-visual-classifier-four-way.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/w286f-visual-classifier-four-way.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w286f-exact:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: GBOGEB/cryoplant-project
      SOURCE_HEAD: 74ae27c786bef1c7a7142e345753cd4da7d2b8fb
      CLASSIFIER_BLOB: a79951f144a5e445b8e1c4a84373c814e4f6734d
      TEST_BLOB: 975f5821f1774095dfd9e29c8a1573086b568a25
      RECEIPT_BLOB: 2c6464afe151ae008c19806864f25fbaab6954a6
      CONTROL_BLOB: 9b6dd32f4402b0ebea364738c89fc4482ba799a7

    steps:
      - name: Checkout executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind mirrored exact QPS payload
        shell: bash
        run: |
          set -euo pipefail
          test -d federation/w286/payload
          echo "SOURCE_HEAD=$SOURCE_HEAD"

      - name: Prove exact four-file payload
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286/payload
          test "$(git hash-object scripts/qps_visual_candidate_classifier.py)" = "$CLASSIFIER_BLOB"
          test "$(git hash-object tests/test_qps_visual_candidate_classifier.py)" = "$TEST_BLOB"
          test "$(git hash-object triage/w286/QPS_W286_VISUAL_CLASSIFIER_FOUR_WAY_CONTROL_v0.1.yaml)" = "$RECEIPT_BLOB"
          test "$(git hash-object controls/QPS_VISUAL_GOLDEN_BASELINE_CURRENT_v0.1.yaml)" = "$CONTROL_BLOB"
          echo PASS_EXACT_W286_CLASSIFIER_BLOBS_4_OF_4

      - name: Execute unchanged classifier regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286/payload
          python -m unittest discover -s tests -p 'test_qps_visual_candidate_classifier.py' -v

      - name: Emit four-way execution receipt
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286/payload
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          script = root / "scripts" / "qps_visual_candidate_classifier.py"
          spec = importlib.util.spec_from_file_location("w286_classifier", script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          golden = "efc646210debc1bf11e3027255c389b92e2de13883223ab6ff2f518a852b83c7"
          intentional = "2c08469879fd9d2bc7ad4b470ad95efc1dc7b7a543c090c90d87df55449ee578"
          regression = "a6414617252f317230f4684c8f6c6ab790d3e9b96ba93f1285c27bc5f9d79131"

          def base():
              return {
                  "schema": "qps-w286-visual-candidate-classification-input/1.0",
                  "sample_only": True,
                  "authority_transfer": False,
                  "formal_credit_delta": 0,
                  "golden_replaced": False,
                  "candidate_promoted": False,
                  "golden_render_sha256": golden,
                  "candidate_render_sha256": golden,
                  "render_changed": False,
                  "declared_visual_change": {"present": False, "changed_property_count": 0},
                  "semantic_mismatch_count": 0,
                  "text_mismatch_count": 0,
                  "geometry_mismatch_count": 0,
                  "out_of_bounds_shape_count": 0,
                  "bounds_status": "PASS",
                  "evidence_complete": True,
              }

          vectors = {}
          d = base()
          vectors["PASS"] = mod.classify_candidate(d)

          d = base()
          d.update(
              candidate_render_sha256=intentional,
              render_changed=True,
              declared_visual_change={"present": True, "changed_property_count": 1},
          )
          vectors["INTENTIONAL_VISUAL_CHANGE"] = mod.classify_candidate(d)

          d = base()
          d.update(
              candidate_render_sha256=regression,
              render_changed=True,
              declared_visual_change={"present": True, "changed_property_count": 3},
              geometry_mismatch_count=3,
              out_of_bounds_shape_count=3,
              bounds_status="FAIL",
          )
          vectors["REGRESSION"] = mod.classify_candidate(d)

          d = base()
          d.update(candidate_render_sha256=intentional, render_changed=True)
          vectors["REVIEW_REQUIRED"] = mod.classify_candidate(d)

          expected = {
              "PASS": "PASS",
              "INTENTIONAL_VISUAL_CHANGE": "INTENTIONAL_VISUAL_CHANGE",
              "REGRESSION": "REGRESSION",
              "REVIEW_REQUIRED": "REVIEW_REQUIRED",
          }
          assert vectors == expected, (vectors, expected)

          receipt = {
              "schema": "qps.w286f.visual_classifier_four_way_execution.v1",
              "status": "PASS_EXECUTED_EXACT_PAYLOAD",
              "authority": "FEDERATED_EXECUTION_ONLY_NOT_VISUAL_OR_ENGINEERING_PROMOTION",
              "source_repo": os.environ["SOURCE_REPO"],
              "source_head_sha": os.environ["SOURCE_HEAD"],
              "executor_repo": os.environ["GITHUB_REPOSITORY"],
              "executor_head_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "exact_source_blobs": {
                  "classifier": os.environ["CLASSIFIER_BLOB"],
                  "tests": os.environ["TEST_BLOB"],
                  "control_receipt": os.environ["RECEIPT_BLOB"],
                  "current_control": os.environ["CONTROL_BLOB"],
              },
              "classifications": vectors,
              "sample_only": True,
              "golden_replaced": False,
              "candidate_promoted": False,
              "authority_transfer": False,
              "formal_credit_delta": 0,
              "runtime_gold_923": "INDEPENDENT_NON_COMPENSATING",
              "N300_method_population": "UNCHANGED",
          }
          out = root / "W286F_VISUAL_CLASSIFIER_EXECUTION_RECEIPT.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          print("RECEIPT_SHA256=" + hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Upload W286F proof
        uses: actions/upload-artifact@v4
        with:
          name: qps-w286f-four-way-${{ github.sha }}
          path: federation/w286/payload/W286F_VISUAL_CLASSIFIER_EXECUTION_RECEIPT.json
          if-no-files-found: error

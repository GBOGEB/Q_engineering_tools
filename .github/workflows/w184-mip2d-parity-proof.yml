name: W184 MIP2D Parity Proof

on:
  pull_request:
    paths:
      - 'payload/w184/**'
      - 'payload/w183/**'
      - '.github/workflows/w184-mip2d-parity-proof.yml'
  push:
    branches: [main]
    paths:
      - 'payload/w184/**'
      - 'payload/w183/**'
      - '.github/workflows/w184-mip2d-parity-proof.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"
      - name: Verify exact cryoplant payload identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { actual="$(git hash-object "$1")"; test "$actual" = "$2" || { echo "$1 blob $actual != $2"; exit 1; }; }
          check_blob payload/w183/common/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml 52592fee795bd19d151f0b7612642d28f5a6a88d
          check_blob payload/w183/common/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml 74387b2e09f9a0ef0f6c440a5362e1d51a7f6a55
          check_blob payload/w183/mip2a/qps_w183_generate_offer_eval_workbook.py 34d3f66ed97c1ef90fb0448b38d2590eec04cd6d
          check_blob payload/w183/mip2b/qps_w183_generate_offer_eval_narrative.py 09fccff8480912df53cdab335d9cdee3c62600b2
          check_blob payload/w183/mip2c/qps_w183_generate_offer_eval_onepagers.py f7ad6dd3439e713672c81d4d7f36f175e857b39c
          check_blob payload/w184/qps_w184_validate_offer_eval_mip2_parity.py 6514ad7384c9ab97e029e4c6d2c00d5ef777e6cb
          check_blob payload/w184/test_w184_offer_eval_mip2_parity.py 00f677e7627e31357db816e336857bf23728c86f
          echo '7/7 exact source blobs PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pyyaml openpyxl python-docx
      - name: Stage exact MIP2D source layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/{scripts,tests,controls} out
          cp payload/w183/common/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml runtime/controls/
          cp payload/w183/common/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml runtime/controls/
          cp payload/w183/mip2a/qps_w183_generate_offer_eval_workbook.py runtime/scripts/
          cp payload/w183/mip2b/qps_w183_generate_offer_eval_narrative.py runtime/scripts/
          cp payload/w183/mip2c/qps_w183_generate_offer_eval_onepagers.py runtime/scripts/
          cp payload/w184/qps_w184_validate_offer_eval_mip2_parity.py runtime/scripts/
          cp payload/w184/test_w184_offer_eval_mip2_parity.py runtime/tests/
      - name: Execute MIP2D regression tests
        run: python -m pytest -q runtime/tests/test_w184_offer_eval_mip2_parity.py
      - name: Generate cross-output parity receipt and artifacts
        run: |
          cd runtime
          python scripts/qps_w184_validate_offer_eval_mip2_parity.py --workdir ../out/products --receipt ../out/W184_MIP2D_PARITY_RECEIPT.json
      - name: Enforce fail-closed propagation gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('out/W184_MIP2D_PARITY_RECEIPT.json').read_text())
          assert r['status']=='PASS_CROSS_OUTPUT_SEMANTIC_PARITY_WITH_NATIVE_EXCEL_GATE_OPEN'
          assert r['same_doctrine_identity'] is True
          assert r['same_offer_cluster_map'] is True
          assert r['native_excel_clean_roundtrip']=='WITHHELD_REQUIRES_EXCEL_RUNTIME'
          assert r['global_3p3_admission']=='HOLD_NATIVE_EXCEL_ROUNDTRIP_AND_CHILD_REENTRY_RECEIPT'
          assert r['authority_transfer'] is False
          assert r['formal_credit_delta']==0
          print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w184-mip2d-parity
          path: out/

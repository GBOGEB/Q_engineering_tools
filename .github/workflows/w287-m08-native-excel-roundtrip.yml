name: W287 M08 Native Excel Roundtrip Gate

on:
  pull_request:
    paths:
      - ".github/workflows/w287-m08-native-excel-roundtrip.yml"
      - "payload/w287/**"
  workflow_dispatch:

jobs:
  native-excel-roundtrip:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact source blobs
        shell: pwsh
        run: |
          $expected = @{
            "payload/w183/mip2a/qps_w183_generate_offer_eval_workbook.py" = "34d3f66ed97c1ef90fb0448b38d2590eec04cd6d"
            "payload/w183/common/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml" = "52592fee795bd19d151f0b7612642d28f5a6a88d"
            "payload/w183/common/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml" = "74387b2e09f9a0ef0f6c440a5362e1d51a7f6a55"
          }
          foreach ($p in $expected.Keys) {
            $actual = (git hash-object $p).Trim()
            if ($actual -ne $expected[$p]) { throw "Blob mismatch $p expected=$($expected[$p]) actual=$actual" }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate governed MIP2 workbook
        shell: pwsh
        run: |
          python -m pip install --upgrade pip openpyxl pyyaml
          New-Item -ItemType Directory -Force -Path out | Out-Null
          python payload/w183/mip2a/qps_w183_generate_offer_eval_workbook.py --doctrine payload/w183/common/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml --control payload/w183/common/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml --output out/OFFER_EVAL_MIP2A.xlsx --receipt out/generator_receipt.json

      - name: Native Microsoft Excel save-close-reopen
        id: excel
        shell: pwsh
        continue-on-error: true
        run: |
          ./payload/w287/Invoke-M08NativeExcelRoundtrip.ps1 -InputXlsx out/OFFER_EVAL_MIP2A.xlsx -OutputXlsx out/OFFER_EVAL_MIP2A.native_excel_roundtrip.xlsx -ReceiptJson out/native_excel_receipt.json

      - name: Classify gate
        shell: pwsh
        run: |
          if (-not (Test-Path out/native_excel_receipt.json)) { throw "native Excel receipt missing" }
          $r = Get-Content out/native_excel_receipt.json -Raw | ConvertFrom-Json
          Write-Host "M08_NATIVE_EXCEL_RESULT=$($r.result)"
          if ($r.result -eq "PASS_NATIVE_EXCEL_SAVE_CLOSE_REOPEN_NO_RECOVERY_LOG") {
            Write-Host "Native Excel gate PASS"
          } elseif ($r.result -eq "BLOCKED_NATIVE_EXCEL_RUNTIME_UNAVAILABLE") {
            throw "BLOCKED_NATIVE_EXCEL_RUNTIME_UNAVAILABLE"
          } else {
            throw "Native Excel gate failed: $($r.result)"
          }

      - name: Upload exact receipt and workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w287-m08-native-excel-roundtrip
          path: |
            out/generator_receipt.json
            out/native_excel_receipt.json
            out/OFFER_EVAL_MIP2A.xlsx
            out/OFFER_EVAL_MIP2A.native_excel_roundtrip.xlsx
          if-no-files-found: warn

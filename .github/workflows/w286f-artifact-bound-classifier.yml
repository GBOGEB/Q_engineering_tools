name: W286F Artifact Bound Visual Classifier

on:
  pull_request:
    paths:
      - '.github/workflows/w286f-artifact-bound-classifier.yml'
      - 'federation/w286_artifact_binding/payload/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/w286f-artifact-bound-classifier.yml'
      - 'federation/w286_artifact_binding/payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: GBOGEB/cryoplant-project
      SOURCE_HEAD: e19434769500090fe859a2a556cc582e41b57294
      CLASSIFIER_BLOB: 0f001192a9167409483b142ad2e46f8161f7153e
      TESTS_BLOB: b1b799cdbf323b89b2ad79b1c384cfd26890b54d
      CONTRACT_BLOB: 7acc4a863c9024c6ad1fe20f924532862c3b157b
      BASELINE_FIXTURE_BLOB: 4fa71a74743c0fda35b5dee8c4e2c39d4164f688
      INTENTIONAL_FIXTURE_BLOB: 2bae7293b719ce4319cc4a9ef50172456361bfb5
      RETIRED_CATALOG_BLOB: a6768ec6b60604d56de86e59c1eb4197c53492ad
      CONTROL_RECEIPT_BLOB: 429a3a024d6ad9f7775a8eee82faf7b14b1adc37
      CURRENT_CONTROL_BLOB: 7368a371c9d55697fd94582fb906ac45dad55ec4

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact eight-file payload
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286_artifact_binding/payload
          test "$(git hash-object scripts/qps_visual_candidate_classifier.py)" = "$CLASSIFIER_BLOB"
          test "$(git hash-object tests/test_qps_visual_candidate_classifier.py)" = "$TESTS_BLOB"
          test "$(git hash-object triage/w286/QPS_W286_VISUAL_CLASSIFIER_CONTRACT_EVIDENCE_v0.1.json)" = "$CONTRACT_BLOB"
          test "$(git hash-object triage/w286/fixtures/QPS_W286_CLASSIFIER_BASELINE_FIXTURE_v0.1.json)" = "$BASELINE_FIXTURE_BLOB"
          test "$(git hash-object triage/w286/fixtures/QPS_W286_CLASSIFIER_INTENTIONAL_FIXTURE_v0.1.json)" = "$INTENTIONAL_FIXTURE_BLOB"
          test "$(git hash-object triage/w286/QPS_W286_VISUAL_CLASSIFIER_EVIDENCE_CATALOG_v0.1.json)" = "$RETIRED_CATALOG_BLOB"
          test "$(git hash-object triage/w286/QPS_W286_VISUAL_CLASSIFIER_FOUR_WAY_CONTROL_v0.1.yaml)" = "$CONTROL_RECEIPT_BLOB"
          test "$(git hash-object controls/QPS_VISUAL_GOLDEN_BASELINE_CURRENT_v0.1.yaml)" = "$CURRENT_CONTROL_BLOB"
          echo PASS_EXACT_W286_ARTIFACT_BOUND_BLOBS_8_OF_8

      - name: Execute repaired 19-function regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286_artifact_binding/payload
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/test_qps_visual_candidate_classifier.py")
          spec = importlib.util.spec_from_file_location("w286_tests", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          tests = sorted((name, fn) for name, fn in vars(mod).items() if name.startswith("test_") and callable(fn))
          assert len(tests) == 19, f"expected 19 tests, found {len(tests)}"
          for name, fn in tests:
              fn()
              print(f"PASS {name}")
          print("PASS_W286_ARTIFACT_BOUND_TESTS_19_OF_19")
          PY

      - name: Emit four classifier states and receipt
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w286_artifact_binding/payload
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          script = root / "scripts/qps_visual_candidate_classifier.py"
          spec = importlib.util.spec_from_file_location("classifier", script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          baseline_sha = "038054735c11a71c64d08a398532c4e014766b7ef5efdd5f6b71e61733857c61"
          intentional_sha = "a57bfae661f44bb10e0cc0fd3a3730fc95fa09d5cd06273e1d3c72a14bb6d044"

          def guards():
              return {
                  "schema": "qps-w286-visual-candidate-classification-input/3.0",
                  "sample_only": True,
                  "authority_transfer": False,
                  "formal_credit_delta": 0,
                  "golden_replaced": False,
                  "candidate_promoted": False,
                  "runtime_gold_923": "INDEPENDENT_NON_COMPENSATING",
                  "N300_method_population": "UNCHANGED",
                  "project_global_PCA": "WITHHELD",
              }

          def contract(evidence_id, sha):
              d = guards()
              d.update(
                  evidence_mode="CONTRACT_REPLAY",
                  evidence_id=evidence_id,
                  candidate_artifact_sha256=sha,
              )
              return d

          def external(hard=False):
              d = guards()
              d.update(
                  evidence_mode="EXTERNAL_UNBOUND",
                  candidate_artifact_sha256="7a92e73c21def5d5c9126141638f4a2caad0fcf7f194a94d04788a3159a86ba0",
                  semantic_mismatch_count=0,
                  text_mismatch_count=0,
                  geometry_mismatch_count=1 if hard else 0,
                  out_of_bounds_shape_count=0,
                  bounds_status="PASS",
                  evidence_complete=True,
              )
              return d

          results = {
              "PASS": mod.classify_candidate(contract("CONTRACT_PASS_01", baseline_sha)),
              "INTENTIONAL_VISUAL_CHANGE": mod.classify_candidate(contract("CONTRACT_INTENTIONAL_01", intentional_sha)),
              "REGRESSION": mod.classify_candidate(external(True)),
              "REVIEW_REQUIRED": mod.classify_candidate(external(False)),
          }
          expected = {
              "PASS": "PASS",
              "INTENTIONAL_VISUAL_CHANGE": "INTENTIONAL_VISUAL_CHANGE",
              "REGRESSION": "REGRESSION",
              "REVIEW_REQUIRED": "REVIEW_REQUIRED",
          }
          assert results == expected, (results, expected)

          receipt = {
              "schema": "qps.w286f.artifact_bound_classifier_execution.v1",
              "status": "PASS_EXECUTED_EXACT_PAYLOAD",
              "source_repo": os.environ["SOURCE_REPO"],
              "source_head_sha_claim": os.environ["SOURCE_HEAD"],
              "source_head_attribution_verified": False,
              "source_head_attribution_status": "WITHHELD_NO_SOURCE_REPO_RUNTIME_ACCESS",
              "executor_repo": os.environ["GITHUB_REPOSITORY"],
              "executor_head_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "exact_blob_count": 8,
              "regression_tests": "PASS_19_OF_19",
              "classifications": results,
              "actual_candidate_bytes_hashed": True,
              "closed_world_fixture_contract": True,
              "unverified_source_head_not_promoted": True,
              "observed_intentional_change_derived_from_artifact_diff": True,
              "historical_external_intentional_candidate_accepting_credit": False,
              "retired_catalog_accepting_authority": False,
              "sample_only": True,
              "golden_replaced": False,
              "candidate_promoted": False,
              "authority_transfer": False,
              "formal_credit_delta": 0,
              "runtime_gold_923": "INDEPENDENT_NON_COMPENSATING",
              "N300_method_population": "UNCHANGED",
              "project_global_PCA": "WITHHELD",
          }
          out = root / "W286F_ARTIFACT_BOUND_EXECUTION_RECEIPT.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          print("RECEIPT_SHA256=" + hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: w286f-artifact-bound-${{ github.sha }}
          path: federation/w286_artifact_binding/payload/W286F_ARTIFACT_BOUND_EXECUTION_RECEIPT.json
          if-no-files-found: error

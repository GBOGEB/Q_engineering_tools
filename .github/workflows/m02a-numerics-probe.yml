name: M02A Engineering Outpost Source and Material Probe

on:
  push:
    branches:
      - main
      - mission/m02a-engineering-outpost-w0
      - mission/m02a-engineering-outpost-w3-provenance
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Verify recovered Git blob identities
        shell: bash
        run: |
          test "$(git hash-object mission/M02A/recovered/numerics.mjs)" = "2d23e1d0ac041d85e45ba157088c699b3f1c9fe6"
          test "$(git hash-object mission/M02A/recovered/materials.mjs)" = "2fff568b3b5f73874581a5004553f1046f7c15a4"
          test "$(git hash-object mission/M02A/recovered/materials.json)" = "65be104be14dc694efb519c98e8939ae7184afec"
      - name: Execute numerical and material adapter suites
        id: probe
        continue-on-error: true
        run: |
          node mission/M02A/numerics_probe.mjs
          node mission/M02A/direct_recovered_probe.mjs
          node mission/M02A/material_adapter_probe.mjs
      - name: Emit fleet receipt
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python mission/federation/emit_receipt.py \
            --mission M02A \
            --repo GBOGEB/Q_engineering_tools \
            --source-sha "$SOURCE_SHA" \
            --outcome "$PROBE_OUTCOME" \
            --kernel mission/M02A/direct_recovered_probe.mjs+mission/M02A/material_adapter_probe.mjs \
            --evidence-class EXECUTED_NIST_PARITY_MATERIAL_ADAPTER \
            --out mission/receipts/qps-receipt-M02A.json
      - name: Upload fleet receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-receipt-M02A-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission/receipts/qps-receipt-M02A.json
      - name: Enforce probe outcome
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outcome }}" = "success"

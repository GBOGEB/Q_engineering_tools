name: M02A Engineering Outpost Numerics Probe

on:
  push:
    branches: [mission/m02a-engineering-outpost-w0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerics-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Verify recovered Git blob identity
        shell: bash
        run: |
          actual="$(git hash-object mission/M02A/recovered/numerics.mjs)"
          test "$actual" = "2d23e1d0ac041d85e45ba157088c699b3f1c9fe6"
      - name: Execute independent and direct recovered numerical suite
        id: probe
        continue-on-error: true
        run: |
          node mission/M02A/numerics_probe.mjs
          node mission/M02A/direct_recovered_probe.mjs
      - name: Emit fleet receipt
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python mission/federation/emit_receipt.py \
            --mission M02A \
            --repo GBOGEB/Q_engineering_tools \
            --source-sha "$SOURCE_SHA" \
            --outcome "$PROBE_OUTCOME" \
            --kernel mission/M02A/direct_recovered_probe.mjs \
            --evidence-class EXECUTED_EXACT_RECOVERED_BLOB \
            --out mission/receipts/qps-receipt-M02A.json
      - name: Upload fleet receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-receipt-M02A-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission/receipts/qps-receipt-M02A.json
      - name: Enforce probe outcome
        if: always()
        shell: bash
        run: test "${{ steps.probe.outcome }}" = "success"

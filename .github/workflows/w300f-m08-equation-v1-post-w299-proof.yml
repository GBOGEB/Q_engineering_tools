name: W300F M08 Equation v1 Post-W299 Reproof

on:
  pull_request:
    paths:
      - 'federation/w299/**'
      - '.github/workflows/w300f-m08-equation-v1-post-w299-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-equation-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact executor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact QPS source blobs and manifest
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w299/payload
          test "$(git hash-object controls/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml)" = "52592fee795bd19d151f0b7612642d28f5a6a88d"
          test "$(git hash-object controls/QPS_OFFER_EVAL_EQUATION_CURRENT_v1.yaml)" = "1a37dd65b79b9b0764ec92f4005667cb08bb63e0"
          test "$(git hash-object controls/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml)" = "2eed4189bef5361bdf25ef79c2e7d1f32a18590e"
          test "$(git hash-object controls/QPS_OFFER_EVAL_PPT_CURRENT_v1.yaml)" = "0520b49259ddb26b293a6c09f281f28a1aae7ee1"
          test "$(git hash-object controls/QPS_OFFER_EVAL_METHOD_CURRENT_v1.yaml)" = "bd06c9f0c9efd8e590cf117d151489aa6ac23940"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_workbook.py)" = "77b69c721d84434ac5c81269df757d95c512637a"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_narrative.py)" = "2d92d5335abe905d7276b3b105496c3d72e3fdc1"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_onepagers.py)" = "0872ac02e89d36ca283f38e6e63dbb17469f7441"
          test "$(git hash-object scripts/qps_w184_validate_offer_eval_mip2_parity.py)" = "354b2840cf755d8d86090cf19263eae5fc3496ea"
          test "$(git hash-object scripts/qps_w288_validate_offer_eval_equation_control.py)" = "fef2f851aae0a7dca08daeb9f74292f0c6719012"
          cd ..
          grep -q 'source_commit: 2bdaf0979a564cd62efb17272729cffff6849031' QPS_W300F_M08_EQUATION_V1_IMPLEMENTATION_PROOF_v1.yaml
          grep -q 'nonnumeric_risk_consumers_guarded: true' QPS_W300F_M08_EQUATION_V1_IMPLEMENTATION_PROOF_v1.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pyyaml openpyxl python-docx

      - name: Execute static equation control validator
        shell: bash
        working-directory: federation/w299/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof
          python scripts/qps_w288_validate_offer_eval_equation_control.py --root . --receipt ../proof/W300_STATIC_EQUATION_RECEIPT.json

      - name: Execute generated cross-output equation parity
        shell: bash
        working-directory: federation/w299/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof/generated
          python scripts/qps_w184_validate_offer_eval_mip2_parity.py --repo-root . --workdir ../proof/generated --receipt ../proof/W300_CROSS_OUTPUT_PARITY_RECEIPT.json

      - name: Verify W299 repair predicates and emit final receipt
        shell: bash
        env:
          EXECUTOR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("federation/w299")
          proof = root / "proof"
          static = json.loads((proof / "W300_STATIC_EQUATION_RECEIPT.json").read_text())
          parity = json.loads((proof / "W300_CROSS_OUTPUT_PARITY_RECEIPT.json").read_text())

          assert static["status"] == "PASS_CONTROL_AND_IMPLEMENTATION_PARITY_STATIC_NATIVE_EXCEL_GATE_OPEN"
          assert static["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert static["system_risk_applied_once"] is True
          assert static["final_system_risk_subtraction"] is False
          assert static["risk_state_precedence_FAIL_DEFER_MISSING"] is True
          assert static["risk_state_precedes_score_completeness"] is True
          assert static["nonnumeric_risk_consumers_guarded"] is True
          assert static["row_state_risk_precedes_score_completeness"] is True
          assert static["native_excel_clean_roundtrip"] == "WITHHELD_EXTERNAL_RUNTIME"

          assert parity["status"] == "PASS_CROSS_OUTPUT_EQUATION_V1_PARITY_WITH_NATIVE_EXCEL_GATE_OPEN"
          assert parity["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert parity["risk_application_count"] == 1
          assert parity["final_system_risk_subtraction"] is False
          assert parity["risk_state_precedence_FAIL_DEFER_MISSING"] is True
          assert parity["risk_state_precedes_score_completeness"] is True
          assert parity["nonnumeric_risk_consumers_guarded"] is True
          assert parity["row_state_risk_precedes_score_completeness"] is True
          assert parity["offer_count"] == 50
          assert parity["cluster_count"] == 8
          assert parity["native_excel_clean_roundtrip"] == "WITHHELD_REQUIRES_EXCEL_RUNTIME"
          assert parity["formal_credit_delta"] == 0

          files = []
          for p in sorted((proof / "generated").rglob("*")):
              if p.is_file():
                  files.append({"path": str(p.relative_to(root)), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size})

          final = {
              "schema": "qps-w300f-m08-equation-v1-post-w299-executed-receipt/1.0",
              "status": "PASS_EXECUTED_POST_W299_EQUATION_V1_IMPLEMENTATION_AND_CROSS_OUTPUT_PARITY",
              "source_repo": "GBOGEB/cryoplant-project",
              "source_commit": "2bdaf0979a564cd62efb17272729cffff6849031",
              "executor_repo": "GBOGEB/Q_engineering_tools",
              "executor_head_sha": os.environ["EXECUTOR_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "equation_version": "OFFER_EVAL_EQ_v1",
              "risk_application_count": 1,
              "final_system_risk_subtraction": False,
              "risk_state_precedence_FAIL_DEFER_MISSING": True,
              "risk_state_precedes_score_completeness": True,
              "nonnumeric_risk_consumers_guarded": True,
              "row_state_risk_precedes_score_completeness": True,
              "generated_files": files,
              "native_excel_clean_roundtrip": "WITHHELD_EXTERNAL_RUNTIME",
              "global_mip3_3p3_admitted": False,
              "formal_credit_delta": 0
          }
          out = proof / "W300F_FINAL_RECEIPT.json"
          out.write_text(json.dumps(final, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY

      - name: Upload W300 post-W299 proof
        uses: actions/upload-artifact@v4
        with:
          name: qps-w300f-m08-equation-v1-post-w299-proof
          path: |
            federation/w299/proof/W300_STATIC_EQUATION_RECEIPT.json
            federation/w299/proof/W300_CROSS_OUTPUT_PARITY_RECEIPT.json
            federation/w299/proof/W300F_FINAL_RECEIPT.json
            federation/w299/proof/generated/
          if-no-files-found: error

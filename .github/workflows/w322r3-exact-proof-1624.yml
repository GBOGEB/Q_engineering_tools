name: W322-R3 Exact Proof 1624

on:
  pull_request:
    paths:
      - ".github/workflows/w322r3-exact-proof-1624.yml"
      - "federation/w322r3_1624/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact cryoplant 1624 payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object federation/w322r3_1624/scripts/qplant_hepak_mip_burndown.py)" = "ce4cbe8eb04cb96de3551ce0c5a10ad420edc5b3"
          test "$(git hash-object federation/w322r3_1624/tests/test_qplant_hepak_mip_burndown.py)" = "8392d8b38de26bc719f04d15d58089b87a5bd0e0"
          test "$(git hash-object federation/w322r3_1624/controls/W322_HEPAK_MIP_3PR_CONTROL_v0.1.yaml)" = "7bc51fe6e3c157609fccc9d28af52d7a92ba3dcd"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove R3 suite
        working-directory: federation/w322r3_1624
        run: python -m unittest discover -s tests -p 'test_qplant_hepak_mip_burndown.py' -v

      - name: Prove R3 optimized interpreter
        working-directory: federation/w322r3_1624
        run: python -O -m unittest discover -s tests -p 'test_qplant_hepak_mip_burndown.py' -v

      - name: Prove empty-source fail closed
        working-directory: federation/w322r3_1624
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w322r3-empty
          mkdir -p /tmp/w322r3-empty out
          python scripts/qplant_hepak_mip_burndown.py \
            --root /tmp/w322r3-empty \
            --json-out out/burndown.json \
            --md-out out/burndown.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("out/burndown.json").read_text())
          assert r["physical_conversion"]["converted"] == 0
          assert r["physical_conversion"]["total"] == 5
          assert r["next_blocker"] == "BT0_HEPAK"
          assert r["formal_engineering_delta"] == 0
          assert r["strict_numerical_delta"] == 0
          PY

      - name: Emit exact R3 receipt
        working-directory: federation/w322r3_1624
        env:
          SOURCE_HEAD: cda25fca9eb62ffff05ed9575ba12abe66d6f46c
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          burndown=json.loads(Path("out/burndown.json").read_text())
          receipt={
            "schema":"qtools.w322r3.exact_proof.v1",
            "source_repo":"GBOGEB/cryoplant-project",
            "source_pr":1624,
            "source_head":os.environ["SOURCE_HEAD"],
            "source_blobs":{
              "script":"ce4cbe8eb04cb96de3551ce0c5a10ad420edc5b3",
              "tests":"8392d8b38de26bc719f04d15d58089b87a5bd0e0",
              "control":"7bc51fe6e3c157609fccc9d28af52d7a92ba3dcd"
            },
            "executor_repo":"GBOGEB/Q_engineering_tools",
            "executor_head":os.environ["GITHUB_SHA"],
            "normal_unit_suite":"PASS",
            "optimized_unit_suite":"PASS",
            "bt2_w57_provenance_regression":"PASS",
            "empty_source_fail_closed":"PASS_0_OF_5_BT0_FIRST",
            "physical_conversion_observed":burndown["physical_conversion"],
            "next_blocker":burndown["next_blocker"],
            "authority_transfer":False,
            "formal_credit_delta":0,
            "compensates_issue_923":False
          }
          p=Path("out/W322R3_1624_EXACT_PROOF_RECEIPT.json")
          p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(p.read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: w322r3-1624-exact-proof
          path: federation/w322r3_1624/out/
          if-no-files-found: error

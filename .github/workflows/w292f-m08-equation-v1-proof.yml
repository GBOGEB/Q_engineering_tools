name: W297F M08 Equation v1 Post-W296 Reproof

on:
  pull_request:
    paths:
      - 'federation/w292/**'
      - '.github/workflows/w292f-m08-equation-v1-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-equation-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact executor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact QPS source blobs
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w292/payload
          test "$(git hash-object controls/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml)" = "52592fee795bd19d151f0b7612642d28f5a6a88d"
          test "$(git hash-object controls/QPS_OFFER_EVAL_EQUATION_CURRENT_v1.yaml)" = "6fc4f4be4537e1b3d0f1dec65e2dc2c96c7ecc53"
          test "$(git hash-object controls/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml)" = "2eed4189bef5361bdf25ef79c2e7d1f32a18590e"
          test "$(git hash-object controls/QPS_OFFER_EVAL_PPT_CURRENT_v1.yaml)" = "0520b49259ddb26b293a6c09f281f28a1aae7ee1"
          test "$(git hash-object controls/QPS_OFFER_EVAL_METHOD_CURRENT_v1.yaml)" = "474b5021c2b4c91b9dcec0016ed9f13f553c48d6"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_workbook.py)" = "137f97f7e8e01efdd575927efbce03d3445b0961"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_narrative.py)" = "2d92d5335abe905d7276b3b105496c3d72e3fdc1"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_onepagers.py)" = "0872ac02e89d36ca283f38e6e63dbb17469f7441"
          test "$(git hash-object scripts/qps_w184_validate_offer_eval_mip2_parity.py)" = "3e6d15f7db4279a8a0885ea6f8263e2b0dd69272"
          test "$(git hash-object scripts/qps_w288_validate_offer_eval_equation_control.py)" = "3446833f0f132e523b3c5363ad29e091399427ef"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pyyaml openpyxl python-docx

      - name: Execute static W288 equation control validator
        shell: bash
        working-directory: federation/w292/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof
          python scripts/qps_w288_validate_offer_eval_equation_control.py             --root .             --receipt ../proof/W292_STATIC_EQUATION_RECEIPT.json

      - name: Execute generated cross-output equation parity
        shell: bash
        working-directory: federation/w292/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof/generated
          python scripts/qps_w184_validate_offer_eval_mip2_parity.py             --repo-root .             --workdir ../proof/generated             --receipt ../proof/W292_CROSS_OUTPUT_PARITY_RECEIPT.json

      - name: Verify proof predicates and emit final receipt
        shell: bash
        env:
          EXECUTOR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("federation/w292")
          proof = root / "proof"
          static = json.loads((proof / "W292_STATIC_EQUATION_RECEIPT.json").read_text())
          parity = json.loads((proof / "W292_CROSS_OUTPUT_PARITY_RECEIPT.json").read_text())

          assert static["status"] == "PASS_CONTROL_AND_IMPLEMENTATION_PARITY_STATIC_NATIVE_EXCEL_GATE_OPEN"
          assert static["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert static["system_risk_applied_once"] is True
          assert static["final_system_risk_subtraction"] is False
          assert static["bt_separate_from_final_review_score"] is True
          assert static["confidence_conditioning_implemented"] is True
          assert static["NA_applicability_implemented"] is True
          assert static["narrative_equation_visibility"] is True
          assert static["risk_state_precedence_FAIL_DEFER_MISSING"] is True
          assert static["risk_state_precedes_score_completeness"] is True
          assert static["offer_count"] == 50
          assert static["cluster_count"] == 8
          assert static["native_excel_clean_roundtrip"] == "WITHHELD_EXTERNAL_RUNTIME"

          assert parity["status"] == "PASS_CROSS_OUTPUT_EQUATION_V1_PARITY_WITH_NATIVE_EXCEL_GATE_OPEN"
          assert parity["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert parity["confidence_conditioning_parity"] is True
          assert parity["NA_applicability_parity"] is True
          assert parity["risk_state_precedence_FAIL_DEFER_MISSING"] is True
          assert parity["risk_state_precedes_score_completeness"] is True
          assert parity["risk_application_count"] == 1
          assert parity["final_system_risk_subtraction"] is False
          assert parity["pairwise_and_risk_separate"] is True
          assert parity["same_doctrine_identity"] is True
          assert parity["same_offer_cluster_map"] is True
          assert parity["offer_count"] == 50
          assert parity["cluster_count"] == 8
          assert parity["native_excel_clean_roundtrip"] == "WITHHELD_REQUIRES_EXCEL_RUNTIME"
          assert parity["formal_credit_delta"] == 0

          files = []
          for p in sorted((proof / "generated").rglob("*")):
              if p.is_file():
                  files.append({
                      "path": str(p.relative_to(root)),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      "bytes": p.stat().st_size,
                  })

          final = {
              "schema": "qps-w297f-m08-equation-v1-post-w296-executed-receipt/1.0",
              "status": "PASS_EXECUTED_EQUATION_V1_IMPLEMENTATION_AND_CROSS_OUTPUT_PARITY",
              "source_repo": "GBOGEB/cryoplant-project",
              "source_commit": "b324075abeb9149f20193bd6652f9988a331d95a",
              "executor_repo": "GBOGEB/Q_engineering_tools",
              "executor_head_sha": os.environ["EXECUTOR_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "equation_version": "OFFER_EVAL_EQ_v1",
              "static_control": "PASS",
              "generated_cross_output_parity": "PASS",
              "workbook_confidence_conditioning": "PASS",
              "NA_applicability_and_renormalization": "PASS",
              "narrative_equation_visibility": "PASS",
              "risk_state_precedence_FAIL_DEFER_MISSING": "PASS",
              "risk_state_precedes_score_completeness": "PASS",
              "ppt_control_semantic_binding": "PASS_CONTROL_ONLY",
              "pptx_outward_binary_regeneration": "WITHHELD_NOT_PROVEN_BY_THIS_TRANSACTION",
              "native_excel_clean_roundtrip": "WITHHELD_EXTERNAL_RUNTIME",
              "risk_application_count": 1,
              "final_system_risk_subtraction": False,
              "generated_files": files,
              "global_mip3_3p3_admitted": False,
              "formal_credit_delta": 0,
          }
          out = proof / "W292F_FINAL_RECEIPT.json"
          out.write_text(json.dumps(final, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY

      - name: Upload W292 equation-v1 proof
        uses: actions/upload-artifact@v4
        with:
          name: qps-w297f-m08-equation-v1-post-w296-proof
          path: |
            federation/w292/proof/W292_STATIC_EQUATION_RECEIPT.json
            federation/w292/proof/W292_CROSS_OUTPUT_PARITY_RECEIPT.json
            federation/w292/proof/W292F_FINAL_RECEIPT.json
            federation/w292/proof/generated/
          if-no-files-found: error

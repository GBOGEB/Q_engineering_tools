name: QPS Reliability G2 Federated Exact

on:
  pull_request:
    paths:
      - 'ocd-adr/40_implementation/QPS_RELIABILITY_SHARED_STATE_LEDGER_G2_v0.1.json'
      - 'scripts/qps_reliability_g2_shared_state.py'
      - '.github/workflows/qps-reliability-g2-federated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove exact child payload blobs
        run: |
          test "$(git hash-object ocd-adr/40_implementation/QPS_RELIABILITY_SHARED_STATE_LEDGER_G2_v0.1.json)" = "525b34004838e9131f26d4d6068390274df0063c"
          test "$(git hash-object scripts/qps_reliability_g2_shared_state.py)" = "416aa9ff38cccb28b0a54422cd10987fc2531337"
      - name: Execute exact shared-state generator
        run: python3 scripts/qps_reliability_g2_shared_state.py
      - name: Bind federated execution provenance
        env:
          EXECUTOR_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('artifacts/qps_reliability_g2/g2_receipt.json')
          r = json.loads(p.read_text())
          assert r['same_ledger_consumed_by_both_domains'] is True
          assert r['unknowns_preserved_as_null'] is True
          assert r['programme_fraction_sum'] == 1.0
          assert r['rundown_event_driven'] is True
          assert r['G2_candidate'] == 'PASS_EXECUTABLE_SHARED_LEDGER_CONSUMPTION'
          assert r['G2_formal_control'].startswith('WITHHELD_')
          fed = {
              'schema': 'qps.reliability.g2.federated_execution_receipt.v0.1',
              'source_repository': 'GBOGEB/cryoplant-project',
              'source_candidate_head': '267c99664253359cb970549e97c4247ab8d75c78',
              'source_blobs': {
                  'ledger': '525b34004838e9131f26d4d6068390274df0063c',
                  'generator': '416aa9ff38cccb28b0a54422cd10987fc2531337'
              },
              'executor_repository': 'GBOGEB/Q_engineering_tools',
              'executor_sha': os.environ['EXECUTOR_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'result': 'PASS_FEDERATED_EXACT_PAYLOAD',
              'G2_formal_control': 'WITHHELD_UNTIL_CHILD_BINDS_EXECUTED_RECEIPT_AND_DOWNSTREAM_MASTER_CONSUMPTION',
              'engineering_credit_delta': 0
          }
          Path('artifacts/qps_reliability_g2/federated_execution_receipt.json').write_text(
              json.dumps(fed, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qps-reliability-g2-federated-receipt
          path: artifacts/qps_reliability_g2/
          if-no-files-found: error

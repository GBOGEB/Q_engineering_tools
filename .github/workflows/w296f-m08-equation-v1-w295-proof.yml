name: W296F M08 Equation v1 W295 Exact Proof

on:
  pull_request:
    paths:
      - 'federation/w296/**'
      - '.github/workflows/w296f-m08-equation-v1-w295-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-w295-exact-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact executor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify 14 exact QPS source blobs
        shell: bash
        run: |
          set -euo pipefail
          cd federation/w296/payload
          test "$(git hash-object controls/QPS_OFFER_EVAL_SCORING_DOCTRINE_v1.yaml)" = "52592fee795bd19d151f0b7612642d28f5a6a88d"
          test "$(git hash-object controls/QPS_OFFER_EVAL_EQUATION_CURRENT_v1.yaml)" = "eae8578123f2fd9d7dc98b3790e5559f9fe07759"
          test "$(git hash-object controls/QPS_OFFER_EVAL_WORKBOOK_DELTA_2026-09-14_v1.yaml)" = "2eed4189bef5361bdf25ef79c2e7d1f32a18590e"
          test "$(git hash-object controls/QPS_OFFER_EVAL_PPT_CURRENT_v1.yaml)" = "0520b49259ddb26b293a6c09f281f28a1aae7ee1"
          test "$(git hash-object controls/QPS_OFFER_EVAL_METHOD_CURRENT_v1.yaml)" = "495a899abe383fa7f28831ac4fd6f51eb4b31b53"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_workbook.py)" = "89ad644bcfd75205c0d520bba4890c90ad4c2495"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_narrative.py)" = "2d92d5335abe905d7276b3b105496c3d72e3fdc1"
          test "$(git hash-object scripts/qps_w183_generate_offer_eval_onepagers.py)" = "0872ac02e89d36ca283f38e6e63dbb17469f7441"
          test "$(git hash-object scripts/qps_w184_validate_offer_eval_mip2_parity.py)" = "ec3fbec1f2f114df3e61f283e3398b04ddb66c36"
          test "$(git hash-object scripts/qps_w288_validate_offer_eval_equation_control.py)" = "f2fe704f8c4c8567d3d2b8c84f1e775b026c77ba"
          test "$(git hash-object scripts/qps_ooxml_normalized_release_identity.py)" = "ad9c549a2b205d94dad80d33cd279487f321ac71"
          test "$(git hash-object tests/test_w183_offer_eval_workbook_adapter.py)" = "270aa5ef47d11944b753c4133ade8a73f7b9a1aa"
          test "$(git hash-object tests/test_w183_offer_eval_narrative_adapter.py)" = "71e3d0003a75776d2e153ad426053cdb8ddb5ed6"
          test "$(git hash-object tests/test_w184_offer_eval_mip2_parity.py)" = "15d9a1c6157537ebfca5b7f539d681571a5735b2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check pyyaml openpyxl python-docx pytest

      - name: Execute targeted regression suite
        shell: bash
        working-directory: federation/w296/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof
          pytest -q             tests/test_w183_offer_eval_workbook_adapter.py             tests/test_w183_offer_eval_narrative_adapter.py             tests/test_w184_offer_eval_mip2_parity.py | tee ../proof/W296_PYTEST.txt

      - name: Execute static equation validator
        shell: bash
        working-directory: federation/w296/payload
        run: |
          set -euo pipefail
          python scripts/qps_w288_validate_offer_eval_equation_control.py             --root .             --receipt ../proof/W296_STATIC_EQUATION_RECEIPT.json

      - name: Execute generated cross-output parity
        shell: bash
        working-directory: federation/w296/payload
        run: |
          set -euo pipefail
          mkdir -p ../proof/generated
          python scripts/qps_w184_validate_offer_eval_mip2_parity.py             --repo-root .             --workdir ../proof/generated             --receipt ../proof/W296_CROSS_OUTPUT_PARITY_RECEIPT.json

      - name: Compute normalized OOXML identities
        shell: bash
        working-directory: federation/w296/payload
        run: |
          set -euo pipefail
          python scripts/qps_ooxml_normalized_release_identity.py             ../proof/generated/OFFER_EVAL_MIP2A.xlsx             ../proof/generated/FULL_RECURSIVE_V6_NARRATIVE_MIP2B.docx             ../proof/generated/onepagers/*.docx             --receipt ../proof/W296_OOXML_IDENTITY_RECEIPT.json > ../proof/W296_OOXML_IDENTITY_STDOUT.json

      - name: Verify all pass predicates and emit final receipt
        shell: bash
        env:
          EXECUTOR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("federation/w296")
          proof = root / "proof"
          static = json.loads((proof / "W296_STATIC_EQUATION_RECEIPT.json").read_text())
          parity = json.loads((proof / "W296_CROSS_OUTPUT_PARITY_RECEIPT.json").read_text())
          identities = json.loads((proof / "W296_OOXML_IDENTITY_RECEIPT.json").read_text())

          assert static["status"] == "PASS_CONTROL_AND_IMPLEMENTATION_PARITY_STATIC_NATIVE_EXCEL_GATE_OPEN"
          assert static["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert static["missing_defer_fail_preserved"] is True
          assert static["all_NA_cluster_unscorable"] is True
          assert static["incomplete_pairwise_totals_withheld"] is True
          assert static["system_risk_applied_once"] is True
          assert static["final_system_risk_subtraction"] is False

          assert parity["status"] == "PASS_CROSS_OUTPUT_EQUATION_V1_PARITY_WITH_NATIVE_EXCEL_GATE_OPEN"
          assert parity["equation_version"] == "OFFER_EVAL_EQ_v1"
          assert parity["missing_defer_fail_preserved"] is True
          assert parity["all_NA_cluster_unscorable"] is True
          assert parity["incomplete_pairwise_totals_withheld"] is True
          assert parity["confidence_conditioning_parity"] is True
          assert parity["NA_applicability_parity"] is True
          assert parity["risk_application_count"] == 1
          assert parity["final_system_risk_subtraction"] is False
          assert parity["pairwise_and_risk_separate"] is True
          assert parity["same_doctrine_identity"] is True
          assert parity["same_offer_cluster_map"] is True
          assert parity["formal_credit_delta"] == 0

          assert len(identities) == 10
          workbook_key = next(k for k in identities if k.endswith("OFFER_EVAL_MIP2A.xlsx"))
          workbook_identity = identities[workbook_key]
          assert workbook_identity["identity_semantics"] == "NORMALIZED_RELEASE_EQUIVALENCE_NOT_RAW_BYTE_IDENTITY"

          generated = []
          for p in sorted((proof / "generated").rglob("*")):
              if p.is_file():
                  generated.append({
                      "path": str(p.relative_to(root)),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      "bytes": p.stat().st_size,
                  })
          assert len([x for x in generated if x["path"].endswith(".xlsx")]) == 1
          assert len([x for x in generated if x["path"].endswith(".docx")]) == 9

          final = {
              "schema": "qps-w296f-m08-equation-v1-w295-executed-receipt/1.0",
              "status": "PASS_W295_EXACT_PAYLOAD_EQUATION_V1",
              "source_repo": "GBOGEB/cryoplant-project",
              "source_commit": "8c7a17688a89f996467af3f4228e35f0fed8fe26",
              "source_pr": 1524,
              "executor_repo": "GBOGEB/Q_engineering_tools",
              "executor_head_sha": os.environ["EXECUTOR_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "equation_version": "OFFER_EVAL_EQ_v1",
              "missing_defer_fail_preserved": True,
              "all_NA_cluster_unscorable": True,
              "incomplete_pairwise_totals_withheld": True,
              "risk_application_count": 1,
              "final_system_risk_subtraction": False,
              "generated_ooxml_count": 10,
              "workbook_raw_sha256": workbook_identity["raw_sha256"],
              "workbook_normalized_release_sha256": workbook_identity["normalized_release_sha256"],
              "workbook_identity_semantics": workbook_identity["identity_semantics"],
              "ppt_control_semantic_binding": "PASS_CONTROL_ONLY",
              "pptx_outward_binary_regeneration": "WITHHELD_NOT_PROVEN_BY_THIS_TRANSACTION",
              "native_excel_clean_roundtrip": "WITHHELD_EXTERNAL_RUNTIME",
              "global_mip3_3p3_admitted": False,
              "formal_credit_delta": 0,
              "generated_files": generated,
          }
          out = proof / "W296F_FINAL_RECEIPT.json"
          out.write_text(json.dumps(final, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY

      - name: Upload W296 exact proof
        uses: actions/upload-artifact@v4
        with:
          name: qps-w296f-m08-equation-v1-w295-proof
          path: federation/w296/proof/
          if-no-files-found: error

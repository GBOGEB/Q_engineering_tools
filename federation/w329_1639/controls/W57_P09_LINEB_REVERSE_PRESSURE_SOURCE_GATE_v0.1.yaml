  per_QCELL_B_flow_complete: false
  spatial_property_field_complete: false
  reverse_pressure_solver_executable: false
  disposition: DEFER
  formal_engineering_delta: 0
  negotiation_delta: 0

accepted_historic_diagnostic_only:
  DN: 150
  OD_mm: 168.3
  wall_mm: 2.77
  ID_mm: 162.76
  authority: HISTORIC_PRESTUDY_DIAGNOSTIC_ONLY
  promotion_to_current_selected_design_allowed: false

solver_release_rule: >-
  Execute reverse pressure only when selected current geometry, per-QCELL B-flow population and spatial thermal
  property field are all source-bound and share a governed operating-state/boundary basis.

anti_overclaim:
  - no_historic_geometry_promotion
  - no_aggregate_B_flow_split_without_source
  - no_JT_flash_counted_as_external_B_stream
  - no_reverse_pressure_execution_with_missing_source_class

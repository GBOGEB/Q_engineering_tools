  per_QCELL_B_flow_population:
    required_modes: [2K_OP, 2K_SB]
    required_configurations: [config24, config30]
    required: [qcell_id, installed_or_future, longitudinal_position, B_flow_g_s, source_locator,
      authority_class, cumulative_segment_flow_g_s, mass_balance_residual]
    current_state: DEFER_PER_QCELL_SOURCE_RETURN_REQUIRED
  spatial_thermal_property_field:
    required: [heat_leak_W_m_or_discrete_W, inlet_T_K, inlet_h_J_kg, outlet_T_K, outlet_h_J_kg,
      phase, rho_kg_m3, mu_Pa_s, provider_version, HEPAK_anchor_or_validation_identity]

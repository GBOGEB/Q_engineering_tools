purpose: >-
  Freeze one canonical OFFER-evaluation score/risk equation family from the already-governed
  W166/W176/W183 surfaces. Preserve static importance before bidder comparison, N/A/missing
  semantics, non-compensating gates, seeded-only A/B status and Option-A risk-once treatment.
  This control explicitly prevents a second system-risk subtraction and prevents the static
  OFFER prior, commercial action ranking and TRIAGE execution pressure from being conflated.


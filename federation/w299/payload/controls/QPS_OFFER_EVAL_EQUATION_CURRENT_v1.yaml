  word_alignment: triage/w166/QPS_W166_OFFER_EVAL_WORD_AUDIT_RISK_ALIGNMENT_v0.1.md
  word_handover: handover/qps_recursive/QPS_W166_OFFER_EVAL_WORD_AUDIT_HANDOVER_2026-09-14_v1.md

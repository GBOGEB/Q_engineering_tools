  current_method: controls/QPS_OFFER_EVAL_METHOD_CURRENT_v1.yaml

equation_version: OFFER_EVAL_EQ_v1

symbols:
  i: OFFER_item
  c: primary_cluster
  b: bidder
  q_i_b: reviewer_response_quality_score_for_bidder_b_on_item_i
  C_i_b: reviewer_confidence_factor_for_that_score
  A_i_b: applicability_indicator_1_applicable_0_true_NA
  lambda_i_c: local_item_weight_inside_cluster_c
  lambda_prime_i_c_b: local_item_weight_renormalized_over_applicable_items_for_bidder_b
  alpha_c: cluster_weight
  G_i_b: hard_gate_indicator_1_pass_0_fail
  BaseRisk_i: item_or_requirement_base_risk
  BidderRisk_i_b: bidder_specific_delivery_risk
  SystemRisk_i_b: allocated_system_or_category_risk_applied_once_at_item_level
  R_max: configured_maximum_risk_factor
  R_i_b: capped_total_risk_applied_once
  E_i_b: conditioned_evaluator_score_q_i_b_times_C_i_b
  X_i_b: risk_adjusted_item_input_after_gate
  ClusterScore_c_b: applicable_weighted_cluster_review_score
  FinalReviewScore_b: aggregate_review_support_score_if_all_noncompensating_gates_pass
  W_i: static_OFFER_importance_weight_used_by_pairwise_prior
  S_i_A_B: sign_pairwise_outcome_in_minus1_0_plus1
  BT_A_B: static_prior_weighted_pairwise_review_signal
  WeightedDelta: optional_magnitude_diagnostic_not_Bradley_Terry

canonical_equations:
  conditioned_evaluator:
    expression: 'E_i_b = q_i_b * C_i_b'
    role: BIDDER_RESPONSE_QUALITY_CONDITIONING
  applicability_renormalization:
    expression: 'lambda_prime_i_c_b = (A_i_b * lambda_i_c) / SUM_j_in_c(A_j_b * lambda_j_c)'
    guard: 'if denominator = 0 then cluster state = NOT_APPLICABLE_OR_UNSCORABLE; do not substitute zero or neutral score'
  raw_risk:
    expression: 'RawRisk_i_b = BaseRisk_i + BidderRisk_i_b + SystemRisk_i_b'
  total_risk:
    expression: 'R_i_b = MIN(R_max, RawRisk_i_b)'
    selected_policy: OPTION_A_SYSTEM_RISK_APPLIED_ONCE_AT_ITEM_LEVEL
  adjusted_item:
    expression: 'X_i_b = E_i_b * G_i_b * (1 - R_i_b)'
    risk_application_count: 1
  cluster_score:
    expression: 'ClusterScore_c_b = SUM_i_in_c(lambda_prime_i_c_b * X_i_b)'
  final_review_score:
    expression: 'FinalReviewScore_b = SUM_c(alpha_c * ClusterScore_c_b)'
    validity_guard: >-
      FinalReviewScore is decision-support only and is not a valid compensating result when any
      mandatory non-compensating gate is failed. A gate failure remains an explicit GATE_FAIL/HOLD.
  governing_pairwise:
    expression: 'BT(A,B) = SUM_i(W_i * S_i(A,B))'
    S_domain: [-1, 0, 1]
    role: STATIC_IMPORTANCE_PRIOR_WEIGHTED_PAIRWISE_REVIEW_SIGNAL
    separate_from_final_review_score: true
  diagnostic_delta:
    expression: 'WeightedDelta_i = W_norm_i * (X_i_A - X_i_B)'
    role: DIAGNOSTIC_ONLY
    must_not_be_called: Bradley_Terry_score

risk_once_proof:
  system_risk_included_in_R_i_b: true
  final_system_risk_subtraction_allowed: false
  second_risk_multiplier_allowed: false
  proof_identity: >-
    Because SystemRisk_i_b is an addend of RawRisk_i_b and therefore already contained in R_i_b,
    X_i_b applies it exactly once through (1-R_i_b). Subtracting R_system again from the aggregate,
    or multiplying by a second system-risk factor, would count the same system-risk allocation twice.
  invariant: SYSTEM_RISK_NE_DOUBLE_COUNTED

legacy_expressions:
  - expression: 'Final = 0.70 * Evaluator + 0.30 * BT - Risk'
    disposition: RETIRED_FROM_CANONICAL_PRODUCTION_USE
    reason: >-
      It mixes the independent bidder-response and static-pairwise layers and permits an ambiguous
      second risk subtraction after item-level risk has already been applied.
  - expression: 'Score_i = W_i * E_i * G_i'
    disposition: RETIRED_AS_CANONICAL_BIDDER_SCORE_FORM
    reason: >-
      W_i is the static requirement-importance prior. The current governed doctrine requires
      reviewer response quality to remain separate from requirement importance; importance is
      consumed by the pairwise/static-prior layer and any explicitly governed diagnostics.
  - expression: 'Final = 0.70 * SUM(Adjusted_i) + 0.30 * BT - R_system'
    disposition: PROHIBITED
    reason: SYSTEM_RISK_WOULD_BE_APPLIED_AT_ITEM_LEVEL_AND_SUBTRACTED_AGAIN

applicability_and_missing:
  N_A:
    action: EXCLUDE_AND_RENORMALIZE_APPLICABLE_LOCAL_WEIGHTS
    not_equal_to: [0, 50]
  missing_but_applicable:
    preserve: [MISSING, DEFER, FAIL]
    not_equal_to_zero: true
    not_cross_bidder_substitutable: true

gate_semantics:
  noncompensating: true
  numeric_indicator_allowed_for_local_formula: true
  aggregate_validity_rule: ANY_MANDATORY_GATE_FAIL_WITHHOLDS_COMPARABLE_FINAL_REVIEW_SCORE
  high_score_cannot_compensate_gate_fail: true

seed_semantics:
  current_A_B_rows: METHOD_DEMONSTRATION_SEEDED_ONLY
  bidder_evidence: false
  award_result: false
  replacement_trigger: SOURCE_BOUND_REAL_OFFER_INTAKE


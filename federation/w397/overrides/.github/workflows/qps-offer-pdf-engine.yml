name: QPS offer PDF engine and math reproduction
on:
  pull_request:
    paths:
      - 'tools/offer_pdf_engine/**'
      - 'tools/property_router/router.py'
      - 'scripts/qps_w142_invcop_thermo_return_cold.py'
      - 'triage/jade_temple_qps/bb_lkt_offer_v1/native_pdf_source_binding.py'
      - '.github/workflows/qps-offer-pdf-engine.yml'
  push:
    branches: [main]
    paths:
      - 'tools/offer_pdf_engine/**'
      - '.github/workflows/qps-offer-pdf-engine.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov PyMuPDF==1.26.4 plotly CoolProp==6.8.0
      - name: Synthetic tests (no bidder material)
        run: |
          python -m pytest -q tools/offer_pdf_engine/tests \
            --cov=tools/offer_pdf_engine --cov-branch --cov-report=term-missing --cov-fail-under=85

  covered_states:
    PASS: BYTE_IDENTICAL_COMMITTED_CONTRACT_FIXTURE
    INTENTIONAL_VISUAL_CHANGE: COMMITTED_CONTRACT_FIXTURE_WITH_INDEPENDENTLY_DERIVED_SINGLE_FILL_CHANGE
    REGRESSION: EXTERNAL_UNBOUND_HARD_DEFECT_VECTOR
    REVIEW_REQUIRED: EXTERNAL_UNBOUND_CLEAN_VECTOR
  rule: >-
    Hard defects classify REGRESSION. External or unbound evidence can never auto-PASS or
    auto-INTENTIONAL and therefore remains REVIEW_REQUIRED unless a hard defect makes it REGRESSION.
    PASS and INTENTIONAL are classifier-contract states proven only from committed fixture bytes
    that the classifier hashes itself; INTENTIONAL additionally requires the classifier to derive
    exactly one fill change from baseline versus candidate content. Historical external W286 visual
    candidates do not grant accepting classifier credit without their real bytes. Every state keeps
    #923 independent/non-compensating, N300 unchanged, project/global PCA withheld, zero formal
    credit, and no golden/candidate promotion.
  historical_merge_1551: IMPLEMENTATION_HISTORY_ONLY_NOT_CONTROL
  historical_merge_1552: IMPLEMENTATION_HISTORY_ONLY_NOT_CONTROL_AFTER_POST_MERGE_REVIEW

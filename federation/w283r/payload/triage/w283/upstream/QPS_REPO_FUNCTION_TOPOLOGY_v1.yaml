purpose: >-
  Current routing topology for GBOGEB repositories that can support QPS TRIAGE.
  This is a Mission Control projection: it classifies which repository function is
  actively used, retained in CONTROL/reserve, conditional, dormant-but-exploitable,
  or maintenance-only. It does not transfer child engineering authority.

state_classes:
  ACTIVE_USED: current canonical function is actively consumed by QPS TRIAGE
  EXECUTION_SATELLITE: current bounded execution carrier; may prove exact payloads but cannot promote source authority
  CONTROL_RESERVE: proven reusable capability held in reserve until a matching consumer need exists
  CONDITIONAL_RESERVE: usable capability whose current activation depends on a named trigger
  DORMANT_CANDIDATE: not currently routed; retained as an exploitable candidate under an explicit trigger
  MAINTENANCE_ONLY: no current QPS TRIAGE worker allocation


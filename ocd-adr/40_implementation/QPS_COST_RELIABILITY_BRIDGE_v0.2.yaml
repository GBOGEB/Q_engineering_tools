  - exposure_h
  - power_kW
  - energy_kWh
  - starts
  - load_fraction
  - pressure_ratio
  - degraded_state_hours
  - redundancy_utilisation
  - lambda_native_per_h
  - p_propagate_to_beam
  - event_class_NONE_A_B_C
